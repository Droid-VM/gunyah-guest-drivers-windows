name: clang-format check
on: [push, pull_request]

jobs:
  clang-format:
    name: Code style check for ${{ matrix.path['check'] }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        path:
          - check: '.'
            # viosnd is vendored from github.com/317764920/viosnd and is kept
            # byte-identical to it so the import can be rebased; reformatting it
            # to this repo's style would bury both that and the pVM port. Only the
            # files written here (ViosndRdma.*) are checked.
            exclude: './VirtIO|./.*/.*trace.h|./NetKVM/Common/virtio_net.h|./NetKVM/linux/if_ether.h|./viofs/shared/fuse.h|./viofs/svc/scope_exit.h|./viosnd/sys/(Adapter|Driver|ViosndDebug|ViosndGuids|ViosndPcm|ViosndTopology|ViosndVirtio|ViosndWaveRT|VirtioSnd|precomp|trace|viosnd)\.'
          - check: 'VirtIO'
            exclude: ''

    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format style check for C/C++ programs.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-16
          bash Tools/clang-format-helper.sh check ${CHECK_PATH} "" ${EXCLUDE_REGEX}
        env:
          CHECK_PATH: ${{ matrix.path['check'] }}
          EXCLUDE_REGEX: ${{ matrix.path['exclude'] }}
